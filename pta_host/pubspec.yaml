name: pta_host
description: "PTA Host Android Companion Server for Vivo S1"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shelf: ^1.4.1
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  permission_handler: ^11.3.1
  battery_plus: ^6.0.2
  network_info_plus: ^6.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  fast_contacts: ^3.1.4
  call_log: ^6.0.1
  pta_shared:
    path: ../pta_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
