name: pta_phone
description: "PTA Phone iOS Liquid Glass Client for iPhone 15 Pro"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  http: ^1.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_callkit_incoming: ^2.0.4
  flutter_webrtc: ^0.12.4
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  pta_shared:
    path: ../pta_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
